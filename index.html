<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Mode PDF Viewer</title>
    <!-- Load PDF.js from a standard CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
      body {
        background-color: #121212;
        color: #e0e0e0;
        font-family: sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
      }
      #controls {
        margin-bottom: 20px;
      }
      #pdf-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      /* The CSS trick that forces Dark Mode safely */
      canvas {
        border: 1px solid #333;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        max-width: 100%;
        /* Invert colors, then restore original hues so images look correct */
        filter: invert(1) hue-rotate(180deg);
      }
      button,
      input {
        background-color: #333;
        color: #fff;
        border: 1px solid #555;
        padding: 8px 12px;
        cursor: pointer;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h2>Dark Mode PDF Viewer</h2>

    <div id="controls">
      <input type="file" id="file-input" accept="application/pdf" />
      <span id="status">Total Pages: <span id="page-count">0</span></span>
    </div>

    <div id="pdf-container"></div>

    <script>
      // Tell PDF.js where the worker script lives
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

      let pdfDoc = null;
      const scale = 1.5,
        pdfContainer = document.getElementById("pdf-container");

      // Render all pages
      function renderAllPages() {
        pdfContainer.innerHTML = "";

        for (let num = 1; num <= pdfDoc.numPages; num++) {
          pdfDoc.getPage(num).then((page) => {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            const viewport = page.getViewport({ scale });

            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = {
              canvasContext: ctx,
              viewport: viewport,
            };

            page.render(renderContext).promise.then(() => {
              // Page rendered successfully
            });

            pdfContainer.appendChild(canvas);
          });
        }
      }

        
      

      // Load the PDF file selected by user locally
      document.getElementById("file-input").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const fileReader = new FileReader();
        fileReader.onload = function () {
          const typedarray = new Uint8Array(this.result);

          pdfjsLib.getDocument(typedarray).promise.then((pdf) => {
            pdfDoc = pdf;
            document.getElementById("page-count").textContent = pdf.numPages;
            renderAllPages();
          });
        };
        fileReader.readAsArrayBuffer(file);
      });
    </script>
  </body>
</html>
