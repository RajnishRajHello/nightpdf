<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dark Mode PDF Viewer</title>
    <!-- Load PDF.js from a standard CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
      /* Dark Mode (Default) */
      body {
        background-color: #121212;
        color: #e0e0e0;
        font-family: sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
        transition:
          background-color 0.3s,
          color 0.3s;
      }

      /* Light Mode */
      body.light-mode {
        background-color: #f5f5f5;
        color: #333;
      }

      #controls {
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
      }

      #pdf-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      /* Canvas styling - Dark Mode */
      canvas {
        border: 1px solid #333;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        max-width: 100%;
        /* Invert colors, then restore original hues so images look correct */
        filter: invert(1) hue-rotate(180deg);
        transition:
          filter 0.3s,
          border-color 0.3s,
          box-shadow 0.3s;
      }

      /* Canvas styling - Light Mode */
      body.light-mode canvas {
        border: 1px solid #ccc;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        filter: none;
      }

      button,
      input {
        background-color: #333;
        color: #fff;
        border: 1px solid #555;
        padding: 8px 12px;
        cursor: pointer;
        border-radius: 4px;
        transition:
          background-color 0.3s,
          color 0.3s,
          border-color 0.3s;
      }

      body.light-mode button,
      body.light-mode input {
        background-color: #fff;
        color: #333;
        border: 1px solid #ccc;
      }

      button:hover {
        background-color: #555;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      #zoom-level {
        display: inline-block;
        min-width: 60px;
        text-align: center;
        font-weight: bold;
      }

      body.light-mode button:hover {
        background-color: #e0e0e0;
      }

      #pdf-container.fullscreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #121212;
        z-index: 9999;
        overflow: auto;
        padding: 40px 20px;
      }

      body.light-mode #pdf-container.fullscreen {
        background-color: #f5f5f5;
      }

      #pdf-container.fullscreen canvas {
        margin: 10px 0;
      }

      #exit-fullscreen {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 10000;
        padding: 10px 15px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <h2>Dark mode PDF Viewer</h2>

    <div id="controls">
      <input type="file" id="file-input" accept="application/pdf" />
      <span id="status">Total Pages: <span id="page-count">0</span></span>
      <button id="zoom-out-btn">🔍−</button>
      <span id="zoom-level">100%</span>
      <button id="zoom-in-btn">🔍+</button>
      <button id="theme-toggle">☀️ Light Mode</button>
      <button id="fullscreen-btn">⛶ Fullscreen</button>
    </div>
    <button id="exit-fullscreen" style="display: none">
      ✕ Exit Fullscreen
    </button>

    <div id="pdf-container"></div>

    <script>
      // Tell PDF.js where the worker script lives
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";

      let pdfDoc = null;
      let currentScale = 10;
      const defaultScale = 10;
      const pdfContainer = document.getElementById("pdf-container"),
        zoomInBtn = document.getElementById("zoom-in-btn"),
        zoomOutBtn = document.getElementById("zoom-out-btn"),
        zoomLevelDisplay = document.getElementById("zoom-level");

      // Theme toggle functionality
      const themeToggle = document.getElementById("theme-toggle");
      const isDarkMode = () => !document.body.classList.contains("light-mode");

      // Load saved theme preference or default to dark mode
      const savedTheme = localStorage.getItem("pdf-viewer-theme") || "dark";
      if (savedTheme === "light") {
        document.body.classList.add("light-mode");
        themeToggle.textContent = "🌙 Dark Mode";
      }

      themeToggle.addEventListener("click", () => {
        document.body.classList.toggle("light-mode");
        const isLight = document.body.classList.contains("light-mode");
        themeToggle.textContent = isLight ? "🌙 Dark Mode" : "☀️ Light Mode";
        localStorage.setItem("pdf-viewer-theme", isLight ? "light" : "dark");
      });

      // Fullscreen functionality
      const fullscreenBtn = document.getElementById("fullscreen-btn");
      const exitFullscreenBtn = document.getElementById("exit-fullscreen");
      const controls = document.getElementById("controls");

      fullscreenBtn.addEventListener("click", () => {
        pdfContainer.classList.add("fullscreen");
        controls.style.display = "none";
        exitFullscreenBtn.style.display = "block";
        document.body.style.overflow = "hidden";
      });

      exitFullscreenBtn.addEventListener("click", () => {
        pdfContainer.classList.remove("fullscreen");
        controls.style.display = "flex";
        exitFullscreenBtn.style.display = "none";
        document.body.style.overflow = "auto";
      });

      // Exit fullscreen on Escape key
      document.addEventListener("keydown", (e) => {
        if (
          e.key === "Escape" &&
          pdfContainer.classList.contains("fullscreen")
        ) {
          exitFullscreenBtn.click();
        }
      });

      // Zoom functionality
      function updateZoomLevel() {
        const zoomPercentage = Math.round((currentScale / defaultScale) * 100);
        zoomLevelDisplay.textContent = `${zoomPercentage}%`;
      }

      zoomInBtn.addEventListener("click", () => {
        currentScale += 0.5;
        if (pdfDoc) {
          renderAllPages();
        }
        updateZoomLevel();
      });

      zoomOutBtn.addEventListener("click", () => {
        if (currentScale > 1) {
          currentScale -= 0.5;
          if (pdfDoc) {
            renderAllPages();
          }
          updateZoomLevel();
        }
      });

      // Keyboard shortcuts for zoom
      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "+") {
          e.preventDefault();
          zoomInBtn.click();
        } else if ((e.ctrlKey || e.metaKey) && e.key === "-") {
          e.preventDefault();
          zoomOutBtn.click();
        }
      });

      // Render all pages
      function renderAllPages() {
        pdfContainer.innerHTML = "";

        for (let num = 1; num <= pdfDoc.numPages; num++) {
          pdfDoc.getPage(num).then((page) => {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            const viewport = page.getViewport({ scale: currentScale });

            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = {
              canvasContext: ctx,
              viewport: viewport,
            };

            page.render(renderContext).promise.then(() => {
              // Page rendered successfully
            });

            pdfContainer.appendChild(canvas);
          });
        }
      }

      // Load the PDF file selected by user locally
      document.getElementById("file-input").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const fileReader = new FileReader();
        fileReader.onload = function () {
          const typedarray = new Uint8Array(this.result);

          pdfjsLib.getDocument(typedarray).promise.then((pdf) => {
            pdfDoc = pdf;
            document.getElementById("page-count").textContent = pdf.numPages;
            renderAllPages();
          });
        };
        fileReader.readAsArrayBuffer(file);
      });
    </script>
  </body>
</html>
